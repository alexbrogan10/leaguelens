# Local stack: Postgres, API, data worker and the built frontend.
#   docker compose up --build      ->  http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leaguelens
      POSTGRES_PASSWORD: leaguelens
      POSTGRES_DB: leaguelens
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaguelens"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://leaguelens:leaguelens@db:5432/leaguelens
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: ./backend
    command: ["python", "-m", "leaguelens.jobs", "worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://leaguelens:leaguelens@db:5432/leaguelens
      REFRESH_INTERVAL_MINUTES: "360"
    depends_on:
      api:
        condition: service_healthy  # the API container runs migrations first

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
